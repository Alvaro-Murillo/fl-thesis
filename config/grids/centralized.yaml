# The centralized baseline (config/centralized.yaml) at trials 0-2, the trials
# every reported grid runs. Trial t has the init seed of the federated runs at
# trial t, so both start from the same weights.
#
#   python -m experiments.run_training --grid config/grids/centralized.yaml
#   python -m analysis.training_summary --grid config/grids/centralized.yaml --prefix centralized
#
# 3 runs, no partitions.

base: config/centralized.yaml

sweep:
  runtime.trial: [0, 1, 2]
