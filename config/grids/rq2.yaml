# RQ2 - pure vs natural label skew, matched on realized label-HD.
#
# Three arms at the same label-HD targets: natural_per_class uncapped,
# natural_per_class with the NIID-Bench cap (`niid_bench`, the condition
# FedArtML-based studies ran), and pure_label, whose client sizes are held at
# N/K. Each arm resolves its own alpha from its own 20-trial curve (CIFAR-10,
# K = 30), since the same alpha does not give the same label-HD in every arm.
# Target 0 means no skew (alpha 1000.0), so the natural arms' target-0 cells are
# the RQ1 grid's alpha = 1000 partitions.
#
# Levels 0, 0.25, 0.45 and 0.70 come from the level rule on the 20-seed label-HD
# ceilings: 0.759 for natural uncapped (the binding arm), 0.774 capped and 0.811
# pure_label. Every arm hits every level with all 20 seeds within 0.05 of the
# target. At 0.70 only 53% (uncapped) and 87% (capped) of raw natural draws meet
# min_size_policy 10, so those cells redraw.
#
# Each arm runs FedAvg and FedProx. FedProx's mu = 0.001 was chosen once, on
# mu_tuning.yaml (the RQ3 cell at label-HD 0.45 x quantity-HD 0.35, trials 3-4),
# by the rule fixed there before any run: mean final accuracy 0.6341 at mu 0.001
# against 0.6287 for FedAvg; 0.01 and 0.1 were within 0.01 of the top mean (0.6409
# at 0.1), so the smallest was taken. The fedavg cells and their config hashes are
# the same as before the fedprox case was added.
#
#   python -m experiments.run_grid --grid config/grids/rq2.yaml
#   python -m analysis.partition_validation
#   python -m experiments.run_training --grid config/grids/rq2.yaml
#
# Trials 0-2 were trained first. Trials 5 and 6 were added on 2026-11-11, before any of
# their results existed: an examiner requirement, applied to every cell. Trials 3 and 4
# tuned mu (mu_tuning.yaml), so no reported run uses them. Every trial 0-2 cell keeps
# its config hash and partition.
#
# 3 arms x 4 levels x 5 trials = 60 partitions; x 2 algorithms = 120 runs.

base: config/base.yaml

constant:
  partition.K: 30
  partition.alpha: null

cases:
  - partition.mode: natural_per_class
    partition.size_cap: none
    partition.min_size_policy: 10
    partition.calibration_id: 147e58d391  # natural_per_class uncapped, 20 trials
    federated.algorithm: fedavg
  - partition.mode: natural_per_class
    partition.size_cap: none
    partition.min_size_policy: 10
    partition.calibration_id: 147e58d391
    federated.algorithm: fedprox
    federated.mu: 0.001
  - partition.mode: natural_per_class
    partition.size_cap: niid_bench
    partition.min_size_policy: 10
    partition.calibration_id: 146de82d74  # natural_per_class niid_bench, 20 trials
    federated.algorithm: fedavg
  - partition.mode: natural_per_class
    partition.size_cap: niid_bench
    partition.min_size_policy: 10
    partition.calibration_id: 146de82d74
    federated.algorithm: fedprox
    federated.mu: 0.001
  - partition.mode: pure_label
    partition.min_size_policy: 0
    partition.calibration_id: 90f8f1dd9b  # pure_label, 20 trials
    federated.algorithm: fedavg
  - partition.mode: pure_label
    partition.min_size_policy: 0
    partition.calibration_id: 90f8f1dd9b
    federated.algorithm: fedprox
    federated.mu: 0.001

sweep:
  partition.target_label_hd: [0.0, 0.25, 0.45, 0.70]
  runtime.trial: [0, 1, 2, 5, 6]
