# RQ3 - deliberate combined skew: label-HD x quantity-HD, every cell combined.
#
# The additivity test compares delta_combined against
# delta_label-only + delta_quantity-only at matched levels. With the lowest level
# on each axis 0, the grid's edges are the single-skew arms and its corner is the
# no-skew baseline (the IID FL baseline), so no separate pure_label or
# quantity_only cells are run. That keeps all three arms on one construction and
# on common random numbers: at a given trial, cells with the same beta hold
# identical client sizes, and cells with the same alpha draw identical label
# mixes. quantity_only would not do as the quantity arm: it is label-blind and
# carries up to ~0.17 incidental label-HD at strong quantity skew (CIFAR-10,
# K = 30); combined at target_label_hd 0 carries 0.010-0.018.
#
# The label levels are RQ2's, 0, 0.25, 0.45 and 0.70, with the same alpha as
# RQ2's pure arm: one alpha per label level, read off the 20-trial pure_label
# curve (90f8f1dd9b), so the drawn mixes are shared across quantity levels. The
# cost is that label-HD rises with quantity skew: at label level 0.45, from 0.446
# at quantity 0 to 0.474 at quantity 0.70 (20-seed means), so the analysis uses
# realized label-HD. A cell gets its own alpha only if one of its trained trials
# misses its label target by more than 0.05.
#
# The quantity levels, 0, 0.35 and 0.70, come from the level rule on the 20-seed
# quantity-HD ceiling, 0.830. beta is read off the 20-trial quantity_only curve
# (8f995f9546). Quantity targets are level names: every size draw is kept, the
# analysis uses each row's realized quantity-HD, and a level is feasible if its
# 20-seed mean is within 0.05 of the target. Level 0.70 realizes 0.668 in
# combined over 20 seeds and is reported by that value. A level at 0.80, near the
# ceiling, is partition-only (rq3_edge.yaml).
#
# Every cell runs FedAvg and FedProx with mu = 0.001, chosen once on
# mu_tuning.yaml (see rq2.yaml). The fedavg cells and their config hashes are the
# same as before the fedprox case was added.
#
#   python -m experiments.run_grid --grid config/grids/rq3.yaml
#   python -m experiments.quantity_levels --grid config/grids/rq3.yaml
#   python -m analysis.partition_validation
#   python -m experiments.run_training --grid config/grids/rq3.yaml
#
# Trials 0-2 were trained first. Trials 5 and 6 were added on 2026-11-11, before any of
# their results existed: an examiner requirement, applied to every cell. Trials 3 and 4
# tuned mu (mu_tuning.yaml), so no reported run uses them. Every trial 0-2 cell keeps
# its config hash and partition.
#
# 4 label x 3 quantity levels x 5 trials = 60 partitions; x 2 algorithms = 120 runs.

base: config/base.yaml

constant:
  partition.mode: combined
  partition.K: 30
  partition.alpha: null
  partition.beta: null
  partition.min_size_policy: 0
  partition.calibration_id: 90f8f1dd9b  # pure_label alpha curve, 20 trials
  partition.quantity_calibration_id: 8f995f9546  # quantity_only beta curve, 20 trials

cases:
  - {federated.algorithm: fedavg}
  - {federated.algorithm: fedprox, federated.mu: 0.001}

sweep:
  partition.target_label_hd: [0.0, 0.25, 0.45, 0.70]
  partition.target_quantity_hd: [0.0, 0.35, 0.70]
  runtime.trial: [0, 1, 2, 5, 6]
