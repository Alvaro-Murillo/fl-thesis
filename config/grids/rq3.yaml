# RQ3 - STUB. Blocked on the target levels and FedProx mu.
#
# The additivity test compares delta_combined against
# delta_label-only + delta_quantity-only at matched levels. Every cell is
# combined: with the lowest level on each axis at 0, the grid's edges are the
# single-skew arms and its corner is the no-skew baseline, so no separate
# pure_label or quantity_only cells are run. That keeps all three arms on one
# construction and on common random numbers: at a given trial, cells with the
# same beta hold identical client sizes, and cells with the same alpha draw
# identical label mixes. quantity_only would not do as the quantity arm: it is
# label-blind and carries up to ~0.17 incidental label-HD at strong quantity
# skew (CIFAR-10, K = 30); combined at target_label_hd 0 carries ~0.01.
#
# Targets resolve to alpha / beta when the grid is expanded
# (partitioning.calibration.resolve_targets). 0 means no skew on that axis
# (concentration 1e6); any other target is read off the pure_label alpha curve
# (da8b82c519, 3 trials; within 0.009 of a 20-trial curve) and the 20-trial
# quantity_only beta curve (8f995f9546; within 0.004 of a 1000-seed mean for
# targets 0.1-0.6, 0.021 at 0.7). Label-HD ranges 0.010-0.791, quantity-HD
# 0.011-0.826.
#
# Quantity targets are level names: every size draw is kept, the analysis uses
# each row's realized quantity-HD, and a level is feasible if its mean over 20
# seeds is within 0.05 of the target. Check the levels before running:
#   python -m experiments.quantity_levels --grid config/grids/rq3.yaml
# On CIFAR-10 at K = 30 every level from 0.0 to 0.7 passes. The 20-seed means
# are within 0.011 of the target up to 0.6 and 0.032 off at 0.7; the per-seed
# sd is 0.012-0.045. Cells with the same beta and trial share one size draw
# (`client_sizes` in the rows).
#
# Still needed:
#   - the label-HD and quantity-HD levels (3 each, the first 0), chosen from the
#     calibrated ranges;
#   - mu for FedProx.

status: blocked
blocked_on: label-HD and quantity-HD levels; FedProx mu

