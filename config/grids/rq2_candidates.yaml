# RQ2 candidate levels: every label-HD target the RQ2 grid might use, checked
# before any level is chosen. Partition-only: no training, no GPU.
#
#   python -m experiments.run_grid --grid config/grids/rq2_candidates.yaml
#   python -m analysis.partition_validation
#
# Both natural arms are here, uncapped and niid_bench-capped, because the RQ2
# natural arm is not chosen yet; the pure arm is pure_label. Each arm resolves
# its own alpha from its own curve (CIFAR-10, K = 30, 3 trials), since the same
# alpha does not give the same label-HD in every arm. Target 0 means no skew
# (concentration 1e6). The curves reach label-HD 0.762 (uncapped), 0.772
# (capped) and 0.791 (pure_label), so 0.75 is the highest common target.
#
# The trials are 0-2, the ones training uses, so these are the very partitions
# a chosen level would train on (partitions are cached by partition_id). The
# label tolerance is per partition: |realized - target| <= 0.05.
#
# 3 arms x 10 targets x 3 trials = 90 partitions.

base: config/base.yaml

constant:
  partition.K: 30
  partition.alpha: null

cases:
  - partition.mode: natural_per_class
    partition.size_cap: none
    partition.min_size_policy: 10
    partition.calibration_id: 96fb06debf
  - partition.mode: natural_per_class
    partition.size_cap: niid_bench
    partition.min_size_policy: 10
    partition.calibration_id: d85a67a9c5
  - partition.mode: pure_label
    partition.min_size_policy: 0
    partition.calibration_id: da8b82c519

sweep:
  partition.target_label_hd: [0.0, 0.1, 0.2, 0.25, 0.3, 0.4, 0.5, 0.6, 0.7, 0.75]
  runtime.trial: [0, 1, 2]
