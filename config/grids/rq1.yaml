# RQ1 - the quantity-skew byproduct of standard Dirichlet label partitioning.
#
# Partition-only: no training, no GPU, fully regenerable from partitions.jsonl.
# `partition_only: true` makes the training runner refuse the grid.
# 3 cases x 10 alphas x 3 client counts x 3 trials = 270 partitions. K = 30 is
# the headline setting; K = 10 and 100 show how the byproduct scales with K.
#
#   python -m experiments.run_grid --grid config/grids/rq1.yaml
#
# Grid contract: see experiments/grid.py. `cases` pairs settings that only make
# sense together - size_cap applies to natural_per_class alone - and is crossed
# with the cartesian `sweep`.
#
# Cells whose min-size redraw budget runs out (expected at small alpha, K=100)
# are recorded as status `infeasible_min_size` rather than dropped: that the
# common min_size=10 convention cannot be met there is itself an RQ1 finding.

partition_only: true

base: config/base.yaml

constant:
  partition.min_size_policy: 10
  partition.max_redraws: 1000

cases:
  - {partition.mode: natural_per_class, partition.size_cap: none}
  - {partition.mode: natural_per_class, partition.size_cap: niid_bench}
  - {partition.mode: natural_per_client, partition.size_cap: none}

sweep:
  partition.alpha: [0.03, 0.1, 0.3, 0.5, 1.0, 5.0, 6.0, 10.0, 100.0, 1000.0]
  partition.K: [10, 30, 100]
  runtime.trial: [0, 1, 2]
