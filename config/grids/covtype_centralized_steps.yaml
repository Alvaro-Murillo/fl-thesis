# POST-HOC SENSITIVITY CHECK of the Covtype centralized baseline, added on 2026-11-08
# after seeing the 10-epoch result (0.9429 at trial 0, below the source paper's 95.60%
# and still rising at epoch 10). The pre-specified baseline stays covtype_centralized.yaml
# (10 epochs, as on CIFAR-10); this grid does not replace it.
#
# The same runs trained for 400 epochs: the optimizer steps of one 40-round x 10-epoch
# federated run (400 x 8,171 steps = 3,268,400, against 3,274,000 for the FedAvg run at
# alpha 1000, trial 0). One Adam for the whole run, the test set evaluated after every
# epoch; final_acc is after epoch 400. Trials 0-4, the federated runs' init seeds.
#
# Every run trained from this grid carries `label` in its runs.jsonl rows.
#
#   python -m experiments.run_training --grid config/grids/covtype_centralized_steps.yaml --shard 0/3
#   (and --shard 1/3, --shard 2/3)
#
# 5 runs, no partitions; about 80 min each alone. Trained last: it was blocked until
# the Covtype FedProx runs were trained, which they were by 2026-11-15, and it is open
# for training since 2026-11-16.

label: >-
  post-hoc sensitivity check, added 2026-11-08 after seeing the 10-epoch centralized
  result; not the pre-specified baseline

base: config/covtype_centralized.yaml

constant:
  federated.local_epochs: 400

sweep:
  runtime.trial: [0, 1, 2, 3, 4]
