# Centralized baseline on Covtype: the whole training set (522,910 samples) as one
# client, no federation. Model, optimizer, learning rate and batch size are
# covtype.yaml's. Like config/centralized.yaml it trains for 10 epochs with one
# Adam, one round's local training on the pooled data; the epoch count is fixed
# here, not picked by test accuracy. final_acc, after epoch 10, is the baseline.
#
# The source paper reports 95.60% +/- 0.10% for centralized Covtype (Jimenez-Gutierrez
# et al., arXiv:2503.17070, Table 3 in v2, Table II in v1; the same value in the feature-
# and quantity-skew tables) and does not state its epoch count.
#
#   python -m experiments.run_training --config config/covtype_centralized.yaml

dataset:
  name: covtype
  num_classes: 7
  root: data
  val_split: 0.0

partition: null

model:
  arch: dnn
  in_channels: 54
  num_classes: 7

federated:
  algorithm: centralized
  rounds: 1
  local_epochs: 10
  batch_size: 64
  lr: 0.001
  mu: 0.0
  optimizer: adam
  client_fraction: 1.0

runtime:
  trial: 0
  deterministic: true
  device: cuda
  out_dir: results
  partition_seed: null
  init_seed: null
  train_seed: null
