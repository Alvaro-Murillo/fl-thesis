# Smoke config for combined: the smallest cell that exercises the two-stage
# nested partitioner end to end. Not used by any reported experiment.
#
#   python -m experiments.run_partition --config config/smoke_combined.yaml
#
# min_size_policy must be 0: this mode never redraws. Client sizes come from the
# quantity_only size draw; quantity_floor null = 3 * num_classes + 1.

dataset:
  name: cifar10
  num_classes: 10
  root: data
  val_split: 0.0

partition:
  mode: combined
  K: 10
  alpha: 0.5
  beta: 1.0
  min_size_policy: 0

model:
  arch: cnn
  in_channels: 3
  num_classes: 10

federated:
  algorithm: fedavg
  rounds: 3
  local_epochs: 1
  batch_size: 64
  lr: 0.001

runtime:
  trial: 0
  deterministic: true
  device: cuda
  out_dir: results
