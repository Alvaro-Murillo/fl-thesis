# Pipeline check: one full run near IID, expected to reach roughly 0.65-0.70 test
# accuracy (the CNN trains to 0.70-0.71 centralized). Not used by any reported
# experiment. The partition is the stored RQ1 cell natural_per_class, uncapped,
# alpha = 1000, K = 30, trial 0 (label-HD 0.010, quantity-HD 0.004).
# Standalone copy of base.yaml; only partition.alpha differs.

dataset:
  name: cifar10
  num_classes: 10
  root: data
  val_split: 0.0

partition:
  mode: natural_per_class
  K: 30
  alpha: 1000.0
  beta: null
  target_label_hd: null
  target_quantity_hd: null
  min_size_policy: 10
  calibration_id: null

model:
  arch: cnn
  in_channels: 3
  num_classes: 10

federated:
  algorithm: fedavg
  rounds: 40
  local_epochs: 10
  batch_size: 64
  lr: 0.001
  mu: 0.0
  optimizer: adam
  client_fraction: 1.0

runtime:
  trial: 0
  deterministic: true
  device: cuda
  out_dir: results
  partition_seed: null
  init_seed: null
  train_seed: null
