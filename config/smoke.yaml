# Smoke config: smallest cell that exercises the full pipeline end to end.
# Used by the reproducibility checks, not by any reported experiment.

dataset:
  name: cifar10
  num_classes: 10
  root: data
  val_split: 0.0

partition:
  mode: natural_per_class
  K: 10
  alpha: 0.5
  min_size_policy: 10

model:
  arch: cnn
  in_channels: 3
  num_classes: 10

federated:
  algorithm: fedavg
  rounds: 3
  local_epochs: 1
  batch_size: 64
  lr: 0.001

runtime:
  trial: 0
  deterministic: true
  device: cuda
  out_dir: results
